<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>BEBES ERP - Escáner QR</title>


  <!-- ==================================================
       MOTOR QR
  =================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        #f1f5f9;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        20px;

    }


    .contenedor {

      width:
        min(520px, 100%);

      background:
        white;

      border-radius:
        20px;

      padding:
        24px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,.15);

      text-align:
        center;

    }


    h1 {

      margin:
        0 0 8px;

      color:
        #0f172a;

      font-size:
        26px;

    }


    .subtitulo {

      margin:
        0 0 20px;

      color:
        #64748b;

      font-size:
        18px;

    }


    #visor {

      position:
        relative;

      width:
        100%;

      max-width:
        450px;

      aspect-ratio:
        3 / 4;

      margin:
        auto;

      background:
        #000;

      border-radius:
        18px;

      overflow:
        hidden;

    }


    #video {

      width:
        100%;

      height:
        100%;

      object-fit:
        cover;

      display:
        block;

    }


    #canvas {

      display:
        none;

    }


    /* ================================================
       MARCO
    ================================================= */

    .marco {

      position:
        absolute;

      width:
        70%;

      aspect-ratio:
        1 / 1;

      left:
        15%;

      top:
        15%;

      border:
        4px solid
        rgba(255,255,255,.95);

      border-radius:
        12px;

      pointer-events:
        none;

    }


    .linea {

      position:
        absolute;

      left:
        5%;

      width:
        90%;

      height:
        3px;

      background:
        #22c55e;

      top:
        10%;

      animation:
        moverLinea
        2s
        linear
        infinite;

    }


    @keyframes moverLinea {

      0% {
        top: 10%;
      }

      50% {
        top: 88%;
      }

      100% {
        top: 10%;
      }

    }


    #estado {

      margin-top:
        18px;

      min-height:
        25px;

      font-weight:
        700;

      color:
        #475569;

      font-size:
        17px;

    }


    #resultado {

      display:
        none;

      margin-top:
        15px;

      padding:
        16px;

      border-radius:
        12px;

      background:
        #f0fdf4;

      color:
        #166534;

      font-size:
        20px;

      font-weight:
        700;

    }


    .botones {

      display:
        flex;

      gap:
        10px;

      margin-top:
        20px;

    }


    button {

      flex:
        1;

      border:
        0;

      border-radius:
        10px;

      padding:
        15px;

      font-size:
        15px;

      font-weight:
        700;

      cursor:
        pointer;

    }


    #btnIniciar {

      background:
        #2563eb;

      color:
        white;

    }


    #btnCerrar {

      background:
        #e2e8f0;

      color:
        #334155;

    }


    button:disabled {

      opacity:
        .55;

      cursor:
        not-allowed;

    }

  </style>

</head>


<body>


<div class="contenedor">


  <h1>
    📦 BEBES ERP
  </h1>


  <p class="subtitulo">
    Escanear código QR
  </p>


  <div id="visor">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>


    <div class="marco">

      <div class="linea"></div>

    </div>

  </div>


  <canvas id="canvas"></canvas>


  <div id="estado">
    Pulsa "Iniciar cámara".
  </div>


  <div id="resultado"></div>


  <div class="botones">


    <button
      id="btnIniciar"
      type="button">

      📷 Iniciar cámara

    </button>


    <button
      id="btnCerrar"
      type="button">

      ✕ Cerrar

    </button>


  </div>


</div>


<script>


// =====================================================
// VARIABLES
// =====================================================

let stream =
  null;


let escaneando =
  false;


let codigoDetectado =
  false;


let animationFrame =
  null;


// =====================================================
// ELEMENTOS
// =====================================================

const video =
  document.getElementById(
    'video'
  );


const canvas =
  document.getElementById(
    'canvas'
  );


const contexto =
  canvas.getContext(
    '2d',
    {
      willReadFrequently:
        true
    }
  );


const estado =
  document.getElementById(
    'estado'
  );


const resultado =
  document.getElementById(
    'resultado'
  );


const btnIniciar =
  document.getElementById(
    'btnIniciar'
  );


const btnCerrar =
  document.getElementById(
    'btnCerrar'
  );


// =====================================================
// INICIAR
// =====================================================

btnIniciar.addEventListener(
  'click',
  iniciarCamara
);


// =====================================================
// CERRAR
// =====================================================

btnCerrar.addEventListener(
  'click',
  cerrarScanner
);


// =====================================================
// INICIAR CÁMARA
// =====================================================

async function iniciarCamara() {


  if (
    escaneando
  ) {

    return;

  }


  codigoDetectado =
    false;


  resultado.style.display =
    'none';


  estado.textContent =
    'Solicitando acceso a la cámara...';


  try {


    console.log(
      '================================'
    );


    console.log(
      'INICIANDO CÁMARA'
    );


    console.log(
      '================================'
    );


    // =================================================
    // CÁMARA TRASERA
    // =================================================

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {

            ideal:
              'environment'

          },

          width: {

            ideal:
              1920

          },

          height: {

            ideal:
              1080

          }

        },

        audio:
          false

      });


    // =================================================
    // ASIGNAR CÁMARA
    // =================================================

    video.srcObject =
      stream;


    await video.play();


    escaneando =
      true;


    btnIniciar.disabled =
      true;


    estado.textContent =
      '📷 Cámara activa. Buscando código QR...';


    console.log(
      'CÁMARA ACTIVA'
    );


    console.log(
      'RESOLUCIÓN:',
      video.videoWidth,
      'x',
      video.videoHeight
    );


    // =================================================
    // INICIAR LECTURA
    // =================================================

    escanearFrame();


  }

  catch (
    error
  ) {


    console.error(
      'ERROR DE CÁMARA:',
      error
    );


    estado.textContent =
      '❌ No se pudo iniciar la cámara.';


    alert(
      'No se pudo iniciar la cámara.\n\n' +
      (
        error.message ||
        error
      )
    );

  }

}


// =====================================================
// ESCANEAR CUADRO
// =====================================================

function escanearFrame() {


  if (
    !escaneando ||
    codigoDetectado
  ) {

    return;

  }


  if (
    video.readyState <
    video.HAVE_ENOUGH_DATA
  ) {

    animationFrame =
      requestAnimationFrame(
        escanearFrame
      );

    return;

  }


  const ancho =
    video.videoWidth;


  const alto =
    video.videoHeight;


  if (
    !ancho ||
    !alto
  ) {

    animationFrame =
      requestAnimationFrame(
        escanearFrame
      );

    return;

  }


  // =================================================
  // RESOLUCIÓN COMPLETA
  // =================================================

  canvas.width =
    ancho;


  canvas.height =
    alto;


  contexto.drawImage(

    video,

    0,
    0,

    ancho,
    alto

  );


  // =================================================
  // OBTENER PÍXELES
  // =================================================

  const imagen =
    contexto.getImageData(

      0,
      0,

      ancho,
      alto

    );


  // =================================================
  // DECODIFICAR QR
  // =================================================

  const codigo =
    jsQR(

      imagen.data,

      imagen.width,

      imagen.height,

      {

        inversionAttempts:
          'attemptBoth'

      }

    );


  // =================================================
  // QR ENCONTRADO
  // =================================================

  if (
    codigo &&
    codigo.data
  ) {


    console.log(
      '================================'
    );


    console.log(
      '✅ QR DETECTADO'
    );


    console.log(
      'CÓDIGO:',
      codigo.data
    );


    console.log(
      '================================'
    );


    procesarQR(
      codigo.data
    );


    return;

  }


  // =================================================
  // CONTINUAR
  // =================================================

  animationFrame =
    requestAnimationFrame(
      escanearFrame
    );

}


// =====================================================
// PROCESAR QR
// =====================================================

async function procesarQR(
  texto
) {


  if (
    codigoDetectado
  ) {

    return;

  }


  // =================================================
  // LIMPIAR CÓDIGO
  // =================================================

  const codigo =
    String(
      texto ||
      ''
    )
    .trim()
    .toUpperCase();


  if (
    !codigo
  ) {

    return;

  }


  // =================================================
  // EVITAR DOBLE LECTURA
  // =================================================

  codigoDetectado =
    true;


  // =================================================
  // MOSTRAR
  // =================================================

  estado.textContent =
    '✅ Código QR detectado.';


  resultado.style.display =
    'block';


  resultado.textContent =
    'Código: ' +
    codigo;


  console.log(
    '================================'
  );


  console.log(
    'CÓDIGO FINAL:',
    codigo
  );


  console.log(
    '================================'
  );


  // =================================================
  // DETENER CÁMARA
  // =================================================

  detenerCamara();


  // =================================================
  // ENVIAR QR A LA VENTANA QUE ABRIÓ EL ESCÁNER
  // =================================================

  enviarQRAlERP(
    codigo
  );

}


// =====================================================
// ENVIAR QR
// =====================================================

function enviarQRAlERP(
  codigo
) {


  codigo =
    String(
      codigo ||
      ''
    )
    .trim()
    .toUpperCase();


  if (
    !codigo
  ) {

    return;

  }


  console.log(
    '================================'
  );


  console.log(
    'ENVIANDO QR AL BEBES ERP'
  );


  console.log(
    'CÓDIGO:',
    codigo
  );


  console.log(
    'OPENER:',
    window.opener
  );


  console.log(
    '================================'
  );


  // =================================================
  // VERIFICAR VENTANA PADRE
  // =================================================

  if (
    !window.opener ||
    window.opener.closed
  ) {

    console.error(
      '❌ No existe la ventana que abrió el escáner.'
    );


    estado.textContent =
      '❌ No se pudo regresar el código al ERP.';


    return;

  }


  // =================================================
  // ENVIAR MENSAJE
  // =================================================

  try {


    window.opener.postMessage(

      {

        tipo:
          'QR_DETECTADO',

        codigo:
          codigo

      },

      '*'

    );


    console.log(
      '================================'
    );


    console.log(
      '✅ QR ENVIADO AL ERP'
    );


    console.log(
      'CÓDIGO ENVIADO:',
      codigo
    );


    console.log(
      '================================'
    );


    estado.textContent =
      '✅ Código enviado a BEBES ERP.';


    // =================================================
    // CERRAR ESCÁNER
    // =================================================

    setTimeout(
      function() {

        try {

          window.close();

        }

        catch(error) {

          console.warn(
            'No se pudo cerrar automáticamente:',
            error
          );

        }

      },
      800
    );


  }

  catch(error) {


    console.error(
      '❌ ERROR ENVIANDO QR:',
      error
    );


    estado.textContent =
      '❌ No se pudo enviar el código al ERP.';

  }

}


// =====================================================
// DETENER CÁMARA
// =====================================================

function detenerCamara() {


  escaneando =
    false;


  // =================================================
  // DETENER ANIMATION FRAME
  // =================================================

  if (
    animationFrame
  ) {

    cancelAnimationFrame(
      animationFrame
    );


    animationFrame =
      null;

  }


  // =================================================
  // DETENER STREAM
  // =================================================

  if (
    stream
  ) {


    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream =
      null;

  }


  // =================================================
  // LIMPIAR VIDEO
  // =================================================

  video.srcObject =
    null;


  btnIniciar.disabled =
    false;

}


// =====================================================
// CERRAR
// =====================================================

function cerrarScanner() {


  detenerCamara();


  // =================================================
  // INTENTAR CERRAR VENTANA
  // =================================================

  try {

    window.close();

  }

  catch(error) {

    console.warn(
      'No se pudo cerrar la ventana:',
      error
    );

  }


  // =================================================
  // SI NO PERMITE CERRAR
  // =================================================

  setTimeout(
    function() {

      if (
        window.history.length > 1
      ) {

        window.history.back();

      }

    },
    300
  );

}


// =====================================================
// INFORMACIÓN INICIAL
// =====================================================

console.log(
  '================================'
);


console.log(
  'BEBES ERP - SCANNER QR'
);


console.log(
  'Motor: jsQR'
);


console.log(
  'Comunicación: postMessage'
);


console.log(
  '================================'
);


</script>


</body>

</html>
